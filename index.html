<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Generator by Kyzz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0d;
    --card: #16131d;
    --border: #3d2e52;
    --text: #ffffff;
    --muted: #b8a9cc;
    --accent: #a855f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(168,85,247,0.25), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(236,72,153,0.2), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(59,130,246,0.15), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
    min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 480px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #22d3ee;
    background: rgba(34,211,238,0.1);
    border: 1px solid rgba(34,211,238,0.35);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: 40px;
    line-height: 1.05;
    margin: 0 0 8px;
    letter-spacing: 0.01em;
    background: linear-gradient(90deg, #a855f7, #ec4899, #3b82f6, #22d3ee, #a855f7);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow 5s linear infinite;
    text-shadow: 2px 2px 0 rgba(168,85,247,0.15);
    transform: rotate(-1.5deg);
  }
  @keyframes rainbow {
    0% { background-position: 0% center; }
    100% { background-position: 300% center; }
  }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; font-weight: 400; }
  .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
  .tab {
    flex: 1;
    padding: 10px 12px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: rgba(255,255,255,0.02);
    color: #c9c7bd;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .tab.active {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: #ffffff;
    border-color: transparent;
    transform: rotate(-1deg) scale(1.02);
    box-shadow: 0 4px 14px rgba(168,85,247,0.35);
  }
  textarea {
    width: 100%;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    resize: none;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button.main {
    margin-top: 14px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: #ffffff;
    border: none;
    border-radius: 16px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(168,85,247,0.35);
    transition: transform 0.15s ease;
  }
  button.main:active { transform: scale(0.98); }
  button.main:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .error { color: #f87171; font-size: 13px; margin-top: 12px; white-space: pre-wrap; line-height: 1.5; }
  .result {
    margin-top: 24px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .result::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #a855f7, #ec4899, #22d3ee);
  }
  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .result-head span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
  .copy-btn {
    background: none;
    border: none;
    color: #22d3ee;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .result p { font-size: 14px; line-height: 1.65; white-space: pre-wrap; margin: 0; color: #eae7f0; }
  .hidden { display: none; }
  .upload-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .upload-box {
    flex: 1;
    background: var(--card);
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    position: relative;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .upload-box.filled { border-style: solid; border-color: var(--accent); padding: 0; overflow: hidden; }
  .upload-box img { width: 100%; height: 110px; object-fit: cover; border-radius: 14px; }
  .upload-box .icon { font-size: 26px; margin-bottom: 6px; }
  .upload-box .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .upload-box input[type=file] { display: none; }
  .upload-box .remove {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,0.6); color: #fff;
    border-radius: 999px; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">✦ AI Prompt Lab</span>
  <h1 id="titleText">Prompt Generator by Kyzz</h1>
  <p class="sub">Prompt jelek masuk, prompt siap pakai keluar.</p>

  <div class="tabs">
    <button class="tab active" id="tab-generate">🖼️ Bikin Foto</button>
    <button class="tab" id="tab-edit">✏️ Edit Foto</button>
    <button class="tab" id="tab-swap">🔄 Gabung Foto</button>
    <button class="tab" id="tab-outfit">👕 Ganti Outfit</button>
  </div>

  <div id="outfitUpload" class="hidden">
    <div class="upload-row">
      <label class="upload-box" id="outfitPersonBox">
        <input type="file" id="outfitPersonFile" accept="image/*">
        <span class="icon">🙋</span>
        <span class="label">Foto Orang (outfit lama)</span>
      </label>
      <label class="upload-box" id="outfitClothBox">
        <input type="file" id="outfitClothFile" accept="image/*">
        <span class="icon">👕</span>
        <span class="label">Foto Outfit Baru</span>
      </label>
    </div>
  </div>

  <div id="swapUpload" class="hidden">
    <p style="font-size:12px; color:var(--muted); margin:0 0 6px;">Foto Wajah (bisa lebih dari 1 kalau referensinya rame)</p>
    <div class="upload-row" id="faceRow" style="flex-wrap:wrap;">
      <label class="upload-box" id="addFaceBox" style="flex:0 0 90px; min-height:90px;">
        <input type="file" id="faceFileInput" accept="image/*">
        <span class="icon">➕</span>
        <span class="label">Tambah Wajah</span>
      </label>
    </div>
    <p style="font-size:12px; color:var(--muted); margin:14px 0 6px;">Foto Referensi (pose/gaya/komposisi)</p>
    <div class="upload-row">
      <label class="upload-box" id="refBox">
        <input type="file" id="refFile" accept="image/*">
        <span class="icon">🎯</span>
        <span class="label">Foto Referensi</span>
      </label>
    </div>
  </div>

  <textarea id="input" rows="4" placeholder="contoh: kucing pake baju astronot"></textarea>

  <button class="main" id="runBtn">🪄 Bikin Prompt</button>

  <p class="error hidden" id="errorMsg"></p>

  <div class="result hidden" id="resultBox">
    <div class="result-head">
      <span>Hasil</span>
      <button class="copy-btn" id="copyBtn">📋 Salin</button>
    </div>
    <p id="resultText"></p>
  </div>

  <p style="text-align:center; margin-top:20px;">
    <button id="changeKeyBtn" style="background:none; border:none; color:var(--muted); font-size:12px; text-decoration:underline; cursor:pointer;">Ganti API Key</button>
  </p>
</div>

<div id="keyModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none; align-items:center; justify-content:center; padding:20px; z-index:999;">
  <div style="background:var(--card); border:2px solid var(--border); border-radius:16px; padding:20px; max-width:360px; width:100%;">
    <p style="margin:0 0 10px; font-weight:700; font-size:15px;">Masukin Gemini API Key</p>
    <p style="margin:0 0 12px; font-size:12px; color:var(--muted); line-height:1.5;">Cuma sekali, disimpan aman di HP ini aja.</p>
    <input type="text" id="keyModalInput" placeholder="AQ.xxxxxxxx" style="width:100%; background:#0e0e12; border:1px solid var(--border); border-radius:10px; padding:10px; color:var(--text); font-size:13px; outline:none; box-sizing:border-box; margin-bottom:12px;">
    <button id="keyModalSave" style="width:100%; background:linear-gradient(135deg, #a855f7, #ec4899); color:#fff; border:none; border-radius:10px; padding:10px; font-weight:700; font-size:14px; cursor:pointer;">Simpan</button>
  </div>
</div>

<script>
  window.onerror = function(msg, url, line, col, error) {
    var box = document.createElement("div");
    box.style.cssText = "position:fixed; top:0; left:0; right:0; background:#7f1d1d; color:#fff; padding:12px; font-size:12px; z-index:9999; white-space:pre-wrap; font-family:monospace;";
    box.textContent = "JS ERROR (baris " + line + "): " + msg;
    document.body.insertBefore(box, document.body.firstChild);
    return false;
  };
</script>
<script>
  const SYSTEMS = {
    generate: `Kamu adalah expert prompt engineer untuk Gemini image generation (Nano Banana / Imagen).
Ubah input mentah user jadi SATU prompt yang SANGAT PANJANG, kaya detail, dan siap pakai untuk MEMBUAT gambar baru dari nol.
ATURAN PANJANG (WAJIB, HITUNG DENGAN TELITI): hasil akhirmu harus MINIMAL 2X jumlah kata input user. Kalau input 700 kata, hasilmu wajib 1400+ kata. Kalau input pendek, hasilmu tetap harus panjang maksimal (mendekati 10.000 kata). Caranya: pecah SETIAP kata/frasa di input jadi beberapa kalimat deskriptif detail (bukan cuma 1 kalimat per detail) — jelaskan tekstur, cahaya, bayangan, warna spesifik, gerakan kain, ekspresi mikro, dsb. JANGAN pernah meringkas, memadatkan, atau menghilangkan detail dari input. Sebelum menjawab, pastikan panjangnya sudah jauh melebihi input.
Wajib cakup semua ini secara detail: deskripsi subjek utama (pose, ekspresi, pakaian, tekstur, material), komposisi & framing (close-up/wide/rule of thirds), pencahayaan (arah cahaya, soft/hard, golden hour dll), palet warna & mood, gaya visual (photoreal/cinematic/ilustrasi/dll beserta referensi gaya/seniman/era kalau relevan), detail lingkungan & background secara mendalam, spesifikasi lensa/kamera (focal length, depth of field, angle, film stock) kalau relevan, atmosfer/cuaca/waktu, serta kualitas render (misal "ultra detailed, 8k, sharp focus, professional photography").
Kalau subjeknya ada wajah manusia/karakter, tambahkan instruksi tegas agar wajah tetap natural, proporsional, dan tidak distorsi.
Tulis sebagai satu paragraf panjang yang mengalir (bukan bullet list), bahasa Inggris, siap copy-paste ke Gemini.
HANYA balas dengan prompt akhirnya, tanpa tanda kutip, tanpa penjelasan, tanpa markdown.

Input mentah dari user: `,
    edit: `Kamu adalah expert prompt engineer untuk Gemini image editing (Nano Banana edit mode).
Ubah input mentah user jadi SATU prompt yang SANGAT PANJANG, kaya detail, dan siap pakai untuk MENGEDIT foto yang sudah ada.
STRUKTUR WAJIB: kalimat PERTAMA prompt hasil harus berupa penegasan menjaga wajah (contoh, kembangkan sendiri: "Keep the exact same face as the original photo — do not change any facial features, bone structure, skin tone, or expression"), baru lanjut ke instruksi edit lainnya. Di kalimat TERAKHIR, tegaskan lagi sekali dengan variasi kalimat berbeda bahwa wajah harus tetap identik dengan foto asli.
ATURAN PANJANG (WAJIB, HITUNG DENGAN TELITI): hasil akhirmu harus MINIMAL 2X jumlah kata input user. Kalau input 700 kata, hasilmu wajib 1400+ kata. Kalau input pendek, hasilmu tetap harus panjang maksimal (mendekati 10.000 kata). Caranya: pecah SETIAP instruksi di input jadi beberapa kalimat detail (bukan cuma 1 kalimat per instruksi) — jelaskan teknik editing, transisi, konsistensi cahaya/warna, dsb secara rinci. JANGAN pernah meringkas, memadatkan, atau menghilangkan detail dari input. Sebelum menjawab, pastikan panjangnya sudah jauh melebihi input.
Wajib cakup semua ini secara detail: apa yang diubah secara spesifik (langkah demi langkah kalau perlu), gaya/kualitas hasil akhir yang diinginkan, lighting/warna kalau berubah, level detail yang diinginkan, pose asli dan proporsi tubuh yang tetap dipertahankan.
Tulis sebagai satu paragraf panjang yang mengalir (bukan bullet list), bahasa Inggris, siap copy-paste ke Gemini.
HANYA balas dengan prompt akhirnya, tanpa tanda kutip, tanpa penjelasan, tanpa markdown.

Input mentah dari user: `,
    swap: `Kamu adalah expert prompt engineer untuk Gemini image editing (Nano Banana), khusus untuk task menggabungkan beberapa foto wajah orang dengan satu foto referensi pose/gaya/outfit/background.
Gambar yang kamu terima: beberapa gambar PERTAMA adalah foto wajah orang-orang yang wajahnya harus dipakai (urutkan sebagai Orang 1, Orang 2, dst sesuai urutan gambar), dan gambar TERAKHIR adalah foto referensi yang menunjukkan pose/komposisi/gaya/outfit/background yang jadi acuan (kalau di foto referensi ada beberapa orang, setiap orang di referensi harus dipetakan ke satu wajah dari Orang 1, Orang 2, dst sesuai urutan posisi mereka di foto).

1) Untuk SETIAP orang: gunakan wajah PERSIS dari foto wajah masing-masing (deskripsikan ciri wajahnya secara detail: bentuk wajah, mata, hidung, bibir, warna kulit, rambut) — wajah ini TIDAK BOLEH diubah sama sekali, dan jelaskan dia menempati posisi mana di komposisi (kiri/kanan/tengah/belakang, dst sesuai referensi).
2) Terapkan pose, komposisi, gaya berpakaian/outfit, warna, lighting, background, dan atmosfer PERSIS seperti di foto referensi (deskripsikan secara sangat detail semua elemen visual di foto referensi: pose masing-masing orang, sudut kamera, pakaian, warna, pencahayaan, background, mood).
3) Jika ada catatan tambahan dari user, sisipkan sebagai penyesuaian di atas dasar tersebut.

ATURAN PANJANG (WAJIB): hasil akhir minimal 250 kata, idealnya 400-700+ kata (makin banyak orang, makin panjang), sangat detail dan tidak generik. Deskripsikan semua yang kamu lihat di semua gambar secermat mungkin.

HANYA balas dengan prompt akhirnya, tanpa tanda kutip, tanpa penjelasan, tanpa markdown.

Catatan tambahan dari user (boleh kosong): `,
    outfit: `Kamu adalah expert prompt engineer untuk Gemini image editing (Nano Banana), khusus untuk task mengganti outfit/pakaian seseorang.
Gambar yang kamu terima: Gambar PERTAMA adalah foto orang dengan wajah dan pose aslinya (outfit di foto ini akan diganti), Gambar KEDUA adalah foto contoh outfit/pakaian baru yang ingin dipakaikan ke orang tersebut (bisa berupa foto baju di gantungan, foto orang lain pakai baju itu, atau flatlay produk).
Tugasmu: lihat kedua gambar, lalu tulis SATU prompt yang SANGAT PANJANG dan detail untuk Gemini image editing, yang menginstruksikan:

3) Jika ada catatan tambahan dari user, sisipkan sebagai penyesuaian di atas dasar tersebut.
STRUKTUR WAJIB: kalimat PERTAMA prompt hasil harus menegaskan wajah dan pose dari Gambar PERTAMA dipertahankan 100%, baru lanjut deskripsikan detail penggantian outfit secara rinci. Di kalimat TERAKHIR, tegaskan lagi sekali dengan variasi kalimat berbeda bahwa wajah tetap identik, hanya outfit yang berubah.
ATURAN PANJANG (WAJIB): hasil akhir minimal 250 kata, idealnya 400-600+ kata, sangat detail dan tidak generik.
Tulis sebagai satu paragraf panjang yang mengalir (bukan bullet list), bahasa Inggris, siap copy-paste ke Gemini image editing.
HANYA balas dengan prompt akhirnya, tanpa tanda kutip, tanpa penjelasan, tanpa markdown.

Catatan tambahan dari user (boleh kosong): `
  };

  let API_KEY = localStorage.getItem("kyzz_api_key") || "";
  const MODELS = ["gemini-3.5-flash-lite", "gemini-3.6-flash", "gemini-3.5-flash"];

  let mode = "generate";
  let faceImages = []; // array of base64
  let refImageB64 = null;
  let outfitPersonB64 = null;
  let outfitClothB64 = null;
  const tabGenerate = document.getElementById("tab-generate");
  const tabEdit = document.getElementById("tab-edit");
  const tabSwap = document.getElementById("tab-swap");
  const tabOutfit = document.getElementById("tab-outfit");
  const swapUpload = document.getElementById("swapUpload");
  const outfitUpload = document.getElementById("outfitUpload");
  const outfitPersonBox = document.getElementById("outfitPersonBox");
  const outfitPersonFile = document.getElementById("outfitPersonFile");
  const outfitClothBox = document.getElementById("outfitClothBox");
  const outfitClothFile = document.getElementById("outfitClothFile");
  const faceRow = document.getElementById("faceRow");
  const addFaceBox = document.getElementById("addFaceBox");
  const faceFileInput = document.getElementById("faceFileInput");
  const refBox = document.getElementById("refBox");
  const refFile = document.getElementById("refFile");
  const input = document.getElementById("input");
  const runBtn = document.getElementById("runBtn");
  const errorMsg = document.getElementById("errorMsg");
  const resultBox = document.getElementById("resultBox");
  const resultText = document.getElementById("resultText");
  const copyBtn = document.getElementById("copyBtn");

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  faceFileInput.addEventListener("change", function () {
    var file = faceFileInput.files[0];
    if (!file) return;
    fileToBase64(file).then(function (b64) {
      faceImages.push(b64);

      var thumb = document.createElement("div");
      thumb.className = "upload-box filled";
      thumb.style.flex = "0 0 90px";
      thumb.style.minHeight = "90px";
      var img = document.createElement("img");
      img.style.height = "90px";
      img.src = "data:" + file.type + ";base64," + b64;
      thumb.appendChild(img);
      var removeBtn = document.createElement("div");
      removeBtn.className = "remove";
      removeBtn.textContent = "✕";
      var idx = faceImages.length - 1;
      removeBtn.onclick = function () {
        faceImages[idx] = null;
        thumb.remove();
      };
      thumb.appendChild(removeBtn);
      faceRow.insertBefore(thumb, addFaceBox);
      faceFileInput.value = "";
    });
  });

  function setupSingleUploadBox(box, fileInput, onLoaded) {
    fileInput.addEventListener("change", function () {
      var file = fileInput.files[0];
      if (!file) return;
      fileToBase64(file).then(function (b64) {
        onLoaded(b64);
        box.classList.add("filled");
        box.innerHTML = "";
        var img = document.createElement("img");
        img.src = "data:" + file.type + ";base64," + b64;
        box.appendChild(img);
        var removeBtn = document.createElement("div");
        removeBtn.className = "remove";
        removeBtn.textContent = "✕";
        removeBtn.onclick = function (e) {
          e.preventDefault();
          e.stopPropagation();
          onLoaded(null);
          box.classList.remove("filled");
          box.appendChild(fileInput);
        };
        box.appendChild(removeBtn);
      });
    });
  }

  setupSingleUploadBox(refBox, refFile, (b64) => { refImageB64 = b64; });
  setupSingleUploadBox(outfitPersonBox, outfitPersonFile, (b64) => { outfitPersonB64 = b64; });
  setupSingleUploadBox(outfitClothBox, outfitClothFile, (b64) => { outfitClothB64 = b64; });

  function hideAllUploads() {
    swapUpload.classList.add("hidden");
    outfitUpload.classList.add("hidden");
  }

  tabGenerate.onclick = () => {
    mode = "generate";
    tabGenerate.classList.add("active");
    tabEdit.classList.remove("active");
    tabSwap.classList.remove("active");
    tabOutfit.classList.remove("active");
    hideAllUploads();
    input.classList.remove("hidden");
    input.placeholder = "contoh: kucing pake baju astronot";
  };
  tabEdit.onclick = () => {
    mode = "edit";
    tabEdit.classList.add("active");
    tabGenerate.classList.remove("active");
    tabSwap.classList.remove("active");
    tabOutfit.classList.remove("active");
    hideAllUploads();
    input.classList.remove("hidden");
    input.placeholder = "contoh: ganti background jadi pantai, orangnya jangan berubah";
  };
  tabSwap.onclick = () => {
    mode = "swap";
    tabSwap.classList.add("active");
    tabGenerate.classList.remove("active");
    tabEdit.classList.remove("active");
    tabOutfit.classList.remove("active");
    hideAllUploads();
    swapUpload.classList.remove("hidden");
    input.classList.remove("hidden");
    input.placeholder = "catatan tambahan (opsional), misal: buat suasana malam hari";
  };
  tabOutfit.onclick = () => {
    mode = "outfit";
    tabOutfit.classList.add("active");
    tabGenerate.classList.remove("active");
    tabEdit.classList.remove("active");
    tabSwap.classList.remove("active");
    hideAllUploads();
    outfitUpload.classList.remove("hidden");
    input.classList.remove("hidden");
    input.placeholder = "catatan tambahan (opsional), misal: pertahankan warna sepatu asli";
  };

  function callModel(modelName, val, images) {
    var url = "https://generativelanguage.googleapis.com/v1beta/models/" + modelName + ":generateContent?key=" + encodeURIComponent(API_KEY);
    var parts = [];
    if (images && images.length) {
      for (var i = 0; i < images.length; i++) {
        parts.push({ inline_data: { mime_type: "image/jpeg", data: images[i] } });
      }
    }
    parts.push({ text: SYSTEMS[mode] + val });
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [
          {
            role: "user",
            parts: parts
          }
        ],
        generationConfig: {
          maxOutputTokens: 16384,
          temperature: 0.9
        }
      })
    }).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (errData) {
          var msg = (errData && errData.error && errData.error.message) || ("HTTP " + res.status);
          var err = new Error(msg);
          err.status = res.status;
          throw err;
        });
      }
      return res.json();
    }).then(function (data) {
      var text = "";
      try {
        var parts2 = data.candidates[0].content.parts;
        for (var i = 0; i < parts2.length; i++) {
          if (parts2[i].text) text += parts2[i].text;
        }
        text = text.trim();
      } catch (e) {
        text = "";
      }
      if (!text) throw new Error("empty");
      return text;
    });
  }

  function tryModels(index, val, images, errorsList) {
    if (index >= MODELS.length) {
      return Promise.reject(errorsList);
    }
    var modelName = MODELS[index];
    runBtn.textContent = index === 0 ? "Bikin prompt..." : ("Coba server lain (" + (index + 1) + "/" + MODELS.length + ")...");
    return callModel(modelName, val, images).catch(function (e) {
      errorsList.push(modelName + ": " + e.message);
      return tryModels(index + 1, val, images, errorsList);
    });
  }

  runBtn.onclick = function () {
    var val = input.value.trim();
    var faces = faceImages.filter(Boolean);
    if (mode === "swap") {
      if (faces.length === 0 || !refImageB64) {
        errorMsg.textContent = "Upload minimal 1 foto wajah & 1 foto referensi.";
        errorMsg.classList.remove("hidden");
        return;
      }
    } else if (mode === "outfit") {
      if (!outfitPersonB64 || !outfitClothB64) {
        errorMsg.textContent = "Upload foto orang & foto outfit baru.";
        errorMsg.classList.remove("hidden");
        return;
      }
    } else if (!val) {
      return;
    }
    runBtn.disabled = true;
    errorMsg.classList.add("hidden");
    resultBox.classList.add("hidden");

    var images = null;
    if (mode === "swap") images = faces.concat([refImageB64]);
    else if (mode === "outfit") images = [outfitPersonB64, outfitClothB64];

    tryModels(0, val, images, []).then(function (text) {
      resultText.textContent = text;
      resultBox.classList.remove("hidden");
    }).catch(function (errorsList) {
      errorMsg.textContent = "Semua server gagal:\n" + errorsList.join("\n");
      errorMsg.classList.remove("hidden");
    }).then(function () {
      runBtn.disabled = false;
      runBtn.textContent = "🪄 Bikin Prompt";
    });
  };

  copyBtn.onclick = () => {
    navigator.clipboard.writeText(resultText.textContent);
    copyBtn.textContent = "✅ Disalin";
    setTimeout(() => (copyBtn.textContent = "📋 Salin"), 1500);
  };

  document.getElementById("changeKeyBtn").onclick = () => {
    openKeyModal();
  };

  function openKeyModal() {
    var modal = document.getElementById("keyModal");
    var keyInput = document.getElementById("keyModalInput");
    keyInput.value = "";
    modal.style.display = "flex";
  }

  document.getElementById("keyModalSave").onclick = function () {
    var keyInput = document.getElementById("keyModalInput");
    var val = keyInput.value.trim();
    if (!val) return;
    API_KEY = val;
    localStorage.setItem("kyzz_api_key", val);
    document.getElementById("keyModal").style.display = "none";
  };

  if (!API_KEY) {
    openKeyModal();
  }
</script>
</body>
</html>
