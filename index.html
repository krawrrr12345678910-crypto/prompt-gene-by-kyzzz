<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Generator by Kyzz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0d;
    --card: #16131d;
    --border: #3d2e52;
    --text: #ffffff;
    --muted: #b8a9cc;
    --accent: #a855f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(168,85,247,0.25), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(236,72,153,0.2), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(59,130,246,0.15), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
    min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 480px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #22d3ee;
    background: rgba(34,211,238,0.1);
    border: 1px solid rgba(34,211,238,0.35);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Permanent Marker', cursive;
    font-size: 40px;
    line-height: 1.05;
    margin: 0 0 8px;
    letter-spacing: 0.01em;
    background: linear-gradient(90deg, #a855f7, #ec4899, #3b82f6, #22d3ee, #a855f7);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow 5s linear infinite;
    text-shadow: 2px 2px 0 rgba(168,85,247,0.15);
    transform: rotate(-1.5deg);
  }
  @keyframes rainbow {
    0% { background-position: 0% center; }
    100% { background-position: 300% center; }
  }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; font-weight: 400; }
  .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
  .tab {
    flex: 1;
    padding: 10px 12px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: rgba(255,255,255,0.02);
    color: #c9c7bd;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .tab.active {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: #ffffff;
    border-color: transparent;
    transform: rotate(-1deg) scale(1.02);
    box-shadow: 0 4px 14px rgba(168,85,247,0.35);
  }
  textarea {
    width: 100%;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    resize: none;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button.main {
    margin-top: 14px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: #ffffff;
    border: none;
    border-radius: 16px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(168,85,247,0.35);
    transition: transform 0.15s ease;
  }
  button.main:active { transform: scale(0.98); }
  button.main:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .error { color: #f87171; font-size: 13px; margin-top: 12px; white-space: pre-wrap; line-height: 1.5; }
  .result {
    margin-top: 24px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .result::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #a855f7, #ec4899, #22d3ee);
  }
  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .result-head span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
  .copy-btn {
    background: none;
    border: none;
    color: #22d3ee;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .result p { font-size: 14px; line-height: 1.65; white-space: pre-wrap; margin: 0; color: #eae7f0; }
  .hidden { display: none; }
  .upload-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .upload-box {
    flex: 1;
    background: var(--card);
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    position: relative;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .upload-box.filled { border-style: solid; border-color: var(--accent); padding: 0; overflow: hidden; }
  .upload-box img { width: 100%; height: 110px; object-fit: cover; border-radius: 14px; }
  .upload-box .icon { font-size: 26px; margin-bottom: 6px; }
  .upload-box .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .upload-box input[type=file] { display: none; }
  .upload-box .remove {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,0.6); color: #fff;
    border-radius: 999px; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">✦ AI Prompt Lab</span>
  <h1 id="titleText">Prompt Generator by Kyzz</h1>
  <p class="sub">Prompt jelek masuk, prompt siap pakai keluar.</p>

  <div class="tabs">
    <button class="tab active" id="tab-generate">🖼️ Bikin Foto</button>
    <button class="tab" id="tab-edit">✏️ Edit Foto</button>
    <button class="tab" id="tab-swap">🔄 Gabung Foto</button>
  </div>

  <div id="swapUpload" class="hidden">
    <div class="upload-row">
      <label class="upload-box" id="faceBox">
        <input type="file" id="faceFile" accept="image/*">
        <span class="icon">🙂</span>
        <span class="label">Foto Wajah Kamu</span>
      </label>
      <label class="upload-box" id="refBox">
        <input type="file" id="refFile" accept="image/*">
        <span class="icon">🎯</span>
        <span class="label">Foto Referensi Pose</span>
      </label>
    </div>
  </div>

  <textarea id="input" rows="4" placeholder="contoh: kucing pake baju astronot"></textarea>

  <button class="main" id="runBtn">🪄 Bikin Prompt</button>

  <p class="error hidden" id="errorMsg"></p>

  <div class="result hidden" id="resultBox">
    <div class="result-head">
      <span>Hasil</span>
      <button class="copy-btn" id="copyBtn">📋 Salin</button>
    </div>
    <p id="resultText"></p>
  </div>
</div>

<script>
  const SYSTEMS = {
    generate: `Kamu adalah expert prompt engineer untuk Gemini image generation (Nano Banana / Imagen).
Ubah input mentah user jadi SATU prompt yang SANGAT PANJANG, kaya detail, dan siap pakai untuk MEMBUAT gambar baru dari nol.
ATURAN PANJANG (WAJIB, HITUNG DENGAN TELITI): hasil akhirmu harus MINIMAL 2X jumlah kata input user. Kalau input 700 kata, hasilmu wajib 1400+ kata. Kalau input pendek, hasilmu tetap harus panjang maksimal (mendekati 10.000 kata). Caranya: pecah SETIAP kata/frasa di input jadi beberapa kalimat deskriptif detail (bukan cuma 1 kalimat per detail) — jelaskan tekstur, cahaya, bayangan, warna spesifik, gerakan kain, ekspresi mikro, dsb. JANGAN pernah meringkas, memadatkan, atau menghilangkan detail dari input. Sebelum menjawab, pastikan panjangnya sudah jauh melebihi input.
Wajib cakup semua ini secara detail: deskripsi subjek utama (pose, ekspresi, pakaian, tekstur, material), komposisi & framing (close-up/wide/rule of thirds), pencahayaan (arah cahaya, soft/hard, golden hour dll), palet warna & mood, gaya visual (photoreal/cinematic/ilustrasi/dll beserta referensi gaya/seniman/era kalau relevan), detail lingkungan & background secara mendalam, spesifikasi lensa/kamera (focal length, depth of field, angle, film stock) kalau relevan, atmosfer/cuaca/waktu, serta kualitas render (misal "ultra detailed, 8k, sharp focus, professional photography").
Kalau subjeknya ada wajah manusia/karakter, tambahkan instruksi tegas agar wajah tetap natural, proporsional, dan tidak distorsi.
Tulis sebagai satu paragraf panjang yang mengalir (bukan bullet list), bahasa Inggris, siap copy-paste ke Gemini.
HANYA balas dengan prompt akhirnya, tanpa tanda kutip, tanpa penjelasan, tanpa markdown.

Input mentah dari user: `,
    edit: `Kamu adalah expert prompt engineer untuk Gemini image editing (Nano Banana edit mode).
Ubah input mentah user jadi SATU prompt yang SANGAT PANJANG, kaya detail, dan siap pakai untuk MENGEDIT foto yang sudah ada.
STRUKTUR WAJIB (URUTAN INI HARUS DIIKUTI): kalimat PERTAMA dan KEDUA di prompt hasil harus berupa penegasan menjaga wajah, sebelum instruksi edit lain disebutkan. Contoh kalimat pembuka (kembangkan, jangan disalin persis): "Keep the exact same face as the original photo — do not change, regenerate, or reinterpret any facial features, bone structure, skin tone, eye shape, nose, lips, or expression. The face must remain 100% identical and recognizable as the same person." Baru setelah itu lanjutkan ke instruksi edit lainnya.
ATURAN PANJANG (WAJIB, HITUNG DENGAN TELITI): hasil akhirmu harus MINIMAL 2X jumlah kata input user. Kalau input 700 kata, hasilmu wajib 1400+ kata. Kalau input pendek, hasilmu tetap harus panjang maksimal (mendekati 10.000 kata). Caranya: pecah SETIAP instruksi di input jadi beberapa kalimat detail (bukan cuma 1 kalimat per instruksi) — jelaskan teknik editing, transisi, konsistensi cahaya/warna, dsb secara rinci. JANGAN pernah meringkas, memadatkan, atau menghilangkan detail dari input. Sebelum menjawab, pastikan panjangnya sudah jauh melebihi input.
Wajib cakup semua ini secara detail: apa yang diubah secara spesifik (langkah demi langkah kalau perlu), gaya/kualitas hasil akhir yang diinginkan, lighting/warna kalau berubah, level detail yang diinginkan.
SANGAT PENTING — selain di kalimat pembuka, ulangi LAGI penegasan menjaga wajah di TENGAH dan di AKHIR prompt (repetisi meningkatkan kepatuhan model image editing). Tegaskan juga pose asli, proporsi tubuh, dan elemen lain yang tidak disebut untuk diubah harus tetap sama. Gunakan variasi kalimat tegas seperti "preserve the original face with zero alterations", "identity and facial structure must stay completely unchanged", "do not generate a new face — only apply the following edits while the face remains pixel-consistent with the source image".
Tulis sebagai satu paragraf panjang yang mengalir (bukan bullet list), bahasa Inggris, siap copy-paste ke Gemini.
HANYA balas dengan prompt akhirnya, tanpa tanda kutip, tanpa penjelasan, tanpa markdown.

Input mentah dari user: `,
    swap: `Kamu adalah expert prompt engineer untuk Gemini image editing (Nano Banana), khusus untuk task menggabungkan dua foto: foto wajah asli seseorang (Gambar 1) dan foto referensi pose/gaya/outfit/background (Gambar 2).
Tugasmu: lihat kedua gambar yang diberikan, lalu tulis SATU prompt yang SANGAT PANJANG dan detail untuk Gemini image editing, yang menginstruksikan:
1) Gunakan wajah PERSIS dari Gambar 1 (deskripsikan ciri wajahnya secara detail: bentuk wajah, mata, hidung, bibir, warna kulit, rambut) — wajah ini TIDAK BOLEH diubah sama sekali.
2) Terapkan pose, komposisi, gaya berpakaian/outfit, warna, lighting, background, dan atmosfer PERSIS seperti di Gambar 2 (deskripsikan secara sangat detail semua elemen visual di Gambar 2: pose badan, sudut kamera, pakaian, warna, pencahayaan, background, mood).
3) Jika ada catatan tambahan dari user, sisipkan sebagai penyesuaian di atas dasar tersebut.
STRUKTUR WAJIB: kalimat PERTAMA dan KEDUA prompt hasil harus menegaskan wajah dari Gambar 1 dipertahankan 100% tanpa perubahan. Baru setelah itu deskripsikan pose/gaya dari Gambar 2 secara sangat rinci. Ulangi lagi penegasan menjaga wajah di TENGAH dan AKHIR prompt.
ATURAN PANJANG (WAJIB): hasil akhir minimal 250 kata, idealnya 400-600+ kata, sangat detail dan tidak generik. Deskripsikan semua yang kamu lihat di kedua gambar secermat mungkin.
Tulis sebagai satu paragraf panjang yang mengalir (bukan bullet list), bahasa Inggris, siap copy-paste ke Gemini image editing.
HANYA balas dengan prompt akhirnya, tanpa tanda kutip, tanpa penjelasan, tanpa markdown.

Catatan tambahan dari user (boleh kosong): `
  };

  const API_KEY = "AQ.Ab8RN6Jpql2cYIUpaKFWdLqBcLtyovuvp5u-0N2jKq11tJicEg";
  const MODELS = ["gemini-3.5-flash-lite", "gemini-3.6-flash", "gemini-3.5-flash"];

  let mode = "generate";
  let faceImageB64 = null;
  let refImageB64 = null;
  const tabGenerate = document.getElementById("tab-generate");
  const tabEdit = document.getElementById("tab-edit");
  const tabSwap = document.getElementById("tab-swap");
  const swapUpload = document.getElementById("swapUpload");
  const faceBox = document.getElementById("faceBox");
  const refBox = document.getElementById("refBox");
  const faceFile = document.getElementById("faceFile");
  const refFile = document.getElementById("refFile");
  const input = document.getElementById("input");
  const runBtn = document.getElementById("runBtn");
  const errorMsg = document.getElementById("errorMsg");
  const resultBox = document.getElementById("resultBox");
  const resultText = document.getElementById("resultText");
  const copyBtn = document.getElementById("copyBtn");

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function setupUploadBox(box, fileInput, onLoaded) {
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const b64 = await fileToBase64(file);
      onLoaded(b64);
      box.classList.add("filled");
      box.innerHTML = "";
      const img = document.createElement("img");
      img.src = "data:" + file.type + ";base64," + b64;
      box.appendChild(img);
      const removeBtn = document.createElement("div");
      removeBtn.className = "remove";
      removeBtn.textContent = "✕";
      removeBtn.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        onLoaded(null);
        box.classList.remove("filled");
        box.appendChild(fileInput);
      };
      box.appendChild(removeBtn);
    });
  }

  setupUploadBox(faceBox, faceFile, (b64) => { faceImageB64 = b64; });
  setupUploadBox(refBox, refFile, (b64) => { refImageB64 = b64; });

  tabGenerate.onclick = () => {
    mode = "generate";
    tabGenerate.classList.add("active");
    tabEdit.classList.remove("active");
    tabSwap.classList.remove("active");
    swapUpload.classList.add("hidden");
    input.classList.remove("hidden");
    input.placeholder = "contoh: kucing pake baju astronot";
  };
  tabEdit.onclick = () => {
    mode = "edit";
    tabEdit.classList.add("active");
    tabGenerate.classList.remove("active");
    tabSwap.classList.remove("active");
    swapUpload.classList.add("hidden");
    input.classList.remove("hidden");
    input.placeholder = "contoh: ganti background jadi pantai, orangnya jangan berubah";
  };
  tabSwap.onclick = () => {
    mode = "swap";
    tabSwap.classList.add("active");
    tabGenerate.classList.remove("active");
    tabEdit.classList.remove("active");
    swapUpload.classList.remove("hidden");
    input.classList.remove("hidden");
    input.placeholder = "catatan tambahan (opsional), misal: buat suasana malam hari";
  };

  async function callModel(modelName, val, images) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(API_KEY)}`;
    const parts = [];
    if (images && images.length) {
      for (const img of images) {
        parts.push({ inline_data: { mime_type: "image/jpeg", data: img } });
      }
    }
    parts.push({ text: SYSTEMS[mode] + val });
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [
          {
            role: "user",
            parts: parts
          }
        ],
        generationConfig: {
          maxOutputTokens: 16384,
          temperature: 0.9
        }
      })
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      const msg = errData?.error?.message || `HTTP ${res.status}`;
      const err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join("\n").trim();
    if (!text) throw new Error("empty");
    return text;
  }

  runBtn.onclick = async () => {
    const val = input.value.trim();
    if (mode === "swap") {
      if (!faceImageB64 || !refImageB64) {
        errorMsg.textContent = "Upload dulu foto wajah & foto referensi.";
        errorMsg.classList.remove("hidden");
        return;
      }
    } else if (!val) {
      return;
    }
    runBtn.disabled = true;
    errorMsg.classList.add("hidden");
    resultBox.classList.add("hidden");

    const images = mode === "swap" ? [faceImageB64, refImageB64] : null;

    let errors = [];
    for (let i = 0; i < MODELS.length; i++) {
      const modelName = MODELS[i];
      runBtn.textContent = i === 0 ? "Bikin prompt..." : `Coba server lain (${i + 1}/${MODELS.length})...`;
      try {
        const text = await callModel(modelName, val, images);
        resultText.textContent = text;
        resultBox.classList.remove("hidden");
        errors = [];
        break;
      } catch (e) {
        errors.push(`${modelName}: ${e.message}`);
        continue;
      }
    }

    if (errors.length > 0) {
      errorMsg.textContent = "Semua server gagal:\n" + errors.join("\n");
      errorMsg.classList.remove("hidden");
    }

    runBtn.disabled = false;
    runBtn.textContent = "🪄 Bikin Prompt";
  };

  copyBtn.onclick = () => {
    navigator.clipboard.writeText(resultText.textContent);
    copyBtn.textContent = "✅ Disalin";
    setTimeout(() => (copyBtn.textContent = "📋 Salin"), 1500);
  };
</script>
</body>
</html>
